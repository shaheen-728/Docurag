[project]
name = "docurag"
version = "0.1.0"
description = "Document question answering using retrieval-augmented generation"
readme = "README.md"
authors = [
    { name = "shaheenkhan", email = "khanshaheen728@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "celery[redis]>=5.7.0",
    "fastapi>=0.163.0",
    "google-genai>=3.4.0",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.3",
    "markdown>=3.11.3",
    "openai>=3.52.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.0",
    "python-multipart>=0.0.34",
    "sentence-transformers>=6.3.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "tenacity>=9.1.4",
    "tiktoken>=0.14.0",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
docurag = "docurag:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
